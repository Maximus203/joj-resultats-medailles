# Déploiement de l'API JOJ sur le serveur alpha, derrière le Traefik partagé (réseau `web`).
# Copié dans /opt/joj-api/ par deploy/alpha/deploy.sh ; les secrets sont dans /opt/joj-api/.env.
name: joj-api

networks:
  web:
    external: true # celui de Traefik : jamais recréé ici
  internal: {}

services:
  postgres:
    image: postgres:17-alpine
    container_name: joj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: joj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?défini dans .env}
      POSTGRES_DB: joj
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U joj -d joj']
      interval: 5s
      timeout: 5s
      retries: 15

  # Migrations seules, étape de déploiement à part (l'API ne migre pas en production). Le seed
  # (données de démonstration de apps/api/data) n'est jamais joué en production.
  migrate:
    image: joj-api:${IMAGE_TAG:-latest}
    container_name: joj-migrate
    command:
      - node
      - --input-type=module
      - -e
      - |
        import pg from 'pg';
        import { drizzle } from 'drizzle-orm/node-postgres';
        import { migrate } from 'drizzle-orm/node-postgres/migrator';
        const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
        await migrate(drizzle({ client: pool }), { migrationsFolder: 'migrations' });
        await pool.end();
        console.log('Migrations appliquées');
    environment:
      DATABASE_URL: postgres://joj:${POSTGRES_PASSWORD}@postgres:5432/joj
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ${SRC_DIR:-./src}
      dockerfile: apps/api/Dockerfile
    image: joj-api:${IMAGE_TAG:-latest}
    container_name: joj-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://joj:${POSTGRES_PASSWORD}@postgres:5432/joj
    networks: [internal, web]
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web'
      - 'traefik.http.services.joj-api.loadbalancer.server.port=3000'
      # Lecture publique : GET/HEAD/OPTIONS, hors documentation.
      - 'traefik.http.routers.joj-api.rule=Host(`${API_HOST}`) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`)) && !PathPrefix(`/api/docs`)'
      - 'traefik.http.routers.joj-api.priority=100'
      - 'traefik.http.routers.joj-api.entrypoints=websecure'
      - 'traefik.http.routers.joj-api.tls=true'
      - 'traefik.http.routers.joj-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.joj-api.service=joj-api'
      # Tout le reste (écritures, Swagger) : authentification basique, en attendant l'authentification
      # applicative. Identifiants dans /opt/joj-api/.env (WRITE_USER / WRITE_PASSWORD).
      - 'traefik.http.routers.joj-api-write.rule=Host(`${API_HOST}`)'
      - 'traefik.http.routers.joj-api-write.priority=10'
      - 'traefik.http.routers.joj-api-write.entrypoints=websecure'
      - 'traefik.http.routers.joj-api-write.tls=true'
      - 'traefik.http.routers.joj-api-write.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.joj-api-write.service=joj-api'
      - 'traefik.http.routers.joj-api-write.middlewares=joj-api-auth'
      - 'traefik.http.middlewares.joj-api-auth.basicauth.users=${WRITE_HTPASSWD:?défini dans .env}'
      - 'traefik.http.middlewares.joj-api-auth.basicauth.realm=JOJ Dakar 2026'

volumes:
  postgres-data:
